<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>其他題庫 | Others — 大B舅父萬題庫</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang HK','Microsoft JhengHei',sans-serif;background:#f0f2f5;color:#333}
.container{max-width:800px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0;color:#fff;border-radius:16px;margin-bottom:20px;background:linear-gradient(135deg,#8e44ad,#9b59b6)}
.header h1{font-size:26px;margin-bottom:4px}
.header p{font-size:14px;opacity:.9}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lang-toggle{display:flex;gap:4px}
.lang-btn{padding:6px 12px;border:1px solid #8e44ad;border-radius:20px;background:#fff;cursor:pointer;font-size:12px;transition:.2s;color:#8e44ad}
.lang-btn.active{background:#8e44ad;color:#fff}
.home-link{padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;text-decoration:none;color:#333;display:inline-block}
.home-link:hover{background:#f5f5f5}
.forms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:24px}
.form-card{padding:28px 16px;background:#fff;border-radius:14px;cursor:pointer;transition:.25s;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center;border:2px solid transparent;text-decoration:none;color:#333;display:block}
.form-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.15);border-color:#8e44ad}
.form-card .form-emoji{font-size:48px;margin-bottom:12px}
.form-card .form-zh{font-size:22px;font-weight:700;margin-bottom:4px}
.form-card .form-en{font-size:13px;color:#888;margin-bottom:8px}
.form-card .form-desc{font-size:12px;color:#666;line-height:1.5}
.form-card .form-badge{display:inline-block;margin-top:12px;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;background:#e8f5e9;color:#2e7d32}
.ft{margin-top:30px;color:#888;font-size:.75rem;text-align:center}
</style>
</head>
<body>
<div class="container">
<div class="top-bar">
<a class="home-link" href="../" data-zh="← 返回主頁" data-en="← Home">← 返回主頁</a>
<div class="lang-toggle">
<button class="lang-btn active" onclick="setLang('zh')">中文</button>
<button class="lang-btn" onclick="setLang('en')">EN</button>
</div>
</div>

<div class="header">
<h1 id="pageTitle" data-zh="🎯 其他題庫" data-en="🎯 Others">🎯 其他題庫</h1>
<p id="pageSub" data-zh="選擇題庫開始練習" data-en="Select a quiz to begin">選擇題庫開始練習</p>
</div>

<div class="forms-grid">
<a class="form-card" href="movies/" style="background:linear-gradient(135deg,#fff5f5,#fff)">
<div class="form-emoji">🎬</div>
<div class="form-zh" data-zh="電影" data-en="Movies">電影</div>
<div class="form-en" data-zh="香港電影問答" data-en="Hong Kong Movie Quiz">香港電影問答</div>
<div class="form-desc" data-zh="周星馳 · 劉德華 · 梁朝偉 · 古天樂 · 嚦咕嚦咕新年財" data-en="Stephen Chow · Andy Lau · Tony Leung · Louis Koo · Fat Choi Spirit">周星馳 · 劉德華 · 梁朝偉 · 古天樂 · 嚦咕嚦咕新年財</div>
<div class="form-badge" data-zh="5 個系列" data-en="5 Series">5 個系列</div>
</a>
<a class="form-card" href="millionaire/" style="background:linear-gradient(135deg,#fffde7,#fff)">
<div class="form-emoji">💰</div>
<div class="form-zh" data-zh="百萬富翁" data-en="Millionaire">百萬富翁</div>
<div class="form-en" data-zh="經典遊戲節目問答" data-en="Classic Game Show Quiz">經典遊戲節目問答</div>
<div class="form-desc" data-zh="Who Wants to Be a Millionaire" data-en="Who Wants to Be a Millionaire">Who Wants to Be a Millionaire</div>
<div class="form-badge" data-zh="益智問答" data-en="Trivia">益智問答</div>
</a>
</div>

<div class="ft">© 2026 Uncle Bruce Institute 大B舅父教室</div>
</div>

<script>
function setLang(lang){
document.querySelectorAll('[data-zh]').forEach(el=>{
el.textContent=el.getAttribute('data-'+lang);
});
document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
document.querySelector('.lang-btn[onclick*="'+lang+'"]').classList.add('active');
document.documentElement.lang=lang==='zh'?'zh-HK':'en';
}
</script>
</body>
</html>
